<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CaYaRouter</title>
  <link rel="stylesheet" href="/caya/caya-app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">C</span><div><strong>CaYaRouter</strong><small>VMG3312-B10B</small></div></div>
      <label class="search"><span>Ara</span><input id="moduleSearch" type="search" placeholder="Ayar veya modül ara"></label>
      <div class="sidebar-navigation">
        <nav id="mainNav" aria-label="Ana menü"></nav>
        <div id="pageTabs" class="page-tabs" aria-label="Modül alt sayfaları"></div>
      </div>
      <div class="sidebar-footer">
        <button id="logoutButton" class="logout-button" type="button">Çıkış yap</button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div><small>CANLI MODEM YÖNETİMİ</small><h1 id="pageTitle">Genel Bakış</h1></div>
        <div class="top-actions"><span id="liveBadge" class="live-badge">Canlı cihaz verisi</span><button id="reloadButton" type="button">Yenile</button></div>
      </header>

      <section class="notice">
        CaYaRouter doğrulanmamış değer üretmez. Alanlar modemin canlı yapılandırmasından okunur; Kaydet ve Uygula işlemleri cihazın gerçek CGI/CMD/WL uçlarına gönderilir.
      </section>

      <section id="viewer" class="viewer">
        <div class="viewer-head">
          <div><small>YEREL AYAR EKRANI</small><strong id="viewerTitle">Genel Bakış</strong></div>
          <span id="viewerPath"></span>
        </div>
        <div id="statusBar" class="status-bar" role="status">Modem verisi yükleniyor…</div>
        <div id="nativePanel" class="native-panel"></div>
      </section>
    </main>
  </div>

  <iframe id="bridgeFrame" class="bridge-frame" title="Zyxel ayar köprüsü" aria-hidden="true"></iframe>
  <script src="/caya/live-modules.js"></script>
  <script src="/caya/caya-app.js"></script>
</body>
</html>
